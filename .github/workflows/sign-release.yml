name: Sign release binaries

# 给托盘（AtlispTray.exe）做 Authenticode 签名。更新器已移除，托盘更新由 atlisp-tray 完成。
#
# 为什么单独一个 workflow：签名需要凭据 / 云端 HSM，不适合每次 PR 都跑；
# 而且签名后的二进制必须是**最终发布**的那一份，不能签完又让 npm 重新编译。
#
# 两个渠道二选一，凭据都没有时整个 job 直接跳过（成功退出，不报警）：
#
#   A. Azure Artifact Signing（原 Trusted Signing，2026-01 更名；付费，Basic 档
#      $9.99/月含 5000 次签名，CI 友好，全自动无需人工审批；证书主体 = Azure
#      订阅的认证身份）
#      需要的 secrets（OIDC 联合身份，不需要客户端密钥）：
#        AZURE_CLIENT_ID / AZURE_TENANT_ID / AZURE_SUBSCRIPTION_ID
#        AZURE_TS_ENDPOINT            例 https://eus.codesigning.azure.net（须与账户区域一致）
#        AZURE_TS_ACCOUNT             签名账户名
#        AZURE_TS_CERT_PROFILE        证书配置档名
#
#   B. SignPath Foundation（开源项目免费，证书在 SignPath 云端）
#      需要先在 SignPath 建好 project / signing policy / artifact configuration，
#      然后在 GitHub 仓库里配置：
#        SIGNPATH_API_TOKEN
#        SIGNPATH_ORGANIZATION_ID
#        SIGNPATH_PROJECT_SLUG
#        SIGNPATH_SIGNING_POLICY_SLUG
#        SIGNPATH_ARTIFACT_CONFIG_SLUG
#
# 本地签名（不经过 CI）：tray/build.ps1 -SignThumbprint <指纹>，见 tray/README.md。

on:
  workflow_dispatch:
    inputs:
      publish:
        description: '签名通过后自动 npm publish（用 --ignore-scripts，避免覆盖已签名产物）'
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  actions: read     # 读取 workflow artifact（SignPath 转发时若仓库转私有需要）
  id-token: write   # Azure Trusted Signing 用 OIDC 登录

jobs:
  sign:
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      signer: ${{ steps.pick.outputs.signer }}
      unsigned_ok: ${{ steps.pick.outputs.unsigned_ok }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: 读取版本号
        id: version
        shell: pwsh
        run: |
          $v = (Get-Content package.json -Raw | ConvertFrom-Json).version
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "package version: $v"

      - run: npm ci

      - name: 选择签名渠道
        id: pick
        shell: pwsh
        run: |
          if ($env:AZURE_TS_ENDPOINT -and $env:AZURE_CLIENT_ID) {
            "signer=azure" >> $env:GITHUB_OUTPUT
            Write-Host "签名渠道：Azure Trusted Signing"
          } elseif ($env:SIGNPATH_API_TOKEN) {
            "signer=signpath" >> $env:GITHUB_OUTPUT
            Write-Host "签名渠道：SignPath Foundation"
          } else {
            "signer=none" >> $env:GITHUB_OUTPUT
            "unsigned_ok=false" >> $env:GITHUB_OUTPUT
            # 未签名的 PE 是 SmartScreen / Defender !ml 的唯一根因，默认拦住发布：
            # 以前这里只 warning，于是 tag 发布照样往下走，人工上传又把未签名件推到
            # atlisp.cn/download —— 用户下载到的就是那个被报毒的 exe。
            #
            # 拿不到证书时（个人/大陆主体常被 CA 拒），把仓库变量
            # ALLOW_UNSIGNED_RELEASE 设为 true 可以显式放行：产出的 exe 必须
            # **冻结不变**（版本资源固定 + -deterministic，改代码才换 hash），
            # 然后按 tray/false-positive-submission.md 向微软/国内厂商提交误报。
            $mustSign = ($env:GITHUB_REF -like 'refs/tags/*') -or ($env:INPUT_PUBLISH -eq 'true')
            if ($mustSign) {
              if ($env:ALLOW_UNSIGNED -eq 'true') {
                "unsigned_ok=true" >> $env:GITHUB_OUTPUT
                Write-Host "::warning title=发布未签名产物::ALLOW_UNSIGNED_RELEASE=true，本次发布会附上未签名的 AtlispTray.exe。用户会看到 SmartScreen「未知发布者」，部分杀软可能报 !ml；请确认该 exe 的 SHA256 已提交误报（tray/false-positive-submission.md）。"
              } else {
                throw "未配置签名凭据（AZURE_TS_* / SIGNPATH_*），但本次是正式发布。未签名 PE 会触发 SmartScreen「未知发布者」并被 Defender 判成 !ml。确实暂时拿不到证书时，把仓库变量 ALLOW_UNSIGNED_RELEASE 设为 true 显式放行。"
              }
            } else {
              Write-Host "::warning title=未配置签名凭据::AZURE_TS_* / SIGNPATH_* 都没有设置，跳过签名。本次仅用于构建验证，产物不得对外发布。"
            }
          }
        env:
          AZURE_TS_ENDPOINT: ${{ secrets.AZURE_TS_ENDPOINT }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          ALLOW_UNSIGNED: ${{ vars.ALLOW_UNSIGNED_RELEASE }}
          INPUT_PUBLISH: ${{ inputs.publish }}

      # 没有签名渠道时**默认不重建**托盘：杀软白名单是按文件哈希给的，重建一次就失效。
      # 直接取线上那份已提交误报的 exe，并核对它等于 tray/exe-baseline.json。
      # 真要重建（tray/ 下源码改了）时把仓库变量 TRAY_REBUILD 设为 true。
      - name: 取已发布托盘（冻结哈希，白名单才有效）
        if: steps.pick.outputs.signer == 'none' && vars.TRAY_REBUILD != 'true'
        shell: pwsh
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $baseline = Get-Content tray/exe-baseline.json -Raw | ConvertFrom-Json
          $url = "https://atlisp.cn/download/AtlispTray.exe?v=$($pkg.version)"
          New-Item -ItemType Directory -Force dist | Out-Null
          Write-Host "下载已发布的托盘二进制：$url"
          Invoke-WebRequest -Uri $url -OutFile dist/AtlispTray.exe
          $actual = (Get-FileHash dist/AtlispTray.exe -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $baseline.sha256.ToLower()) {
            throw "下载到的 exe 哈希 ($actual) 与白名单基线 ($($baseline.sha256)) 不一致：线上文件已被替换或基线过期。核对 tray/exe-baseline.json，或设 TRAY_REBUILD=true 重建并重新提交误报。"
          }
          Write-Host "哈希与白名单基线一致：$actual"
          npm run build:tray-manifest

      # 走 Windows 自带 csc.exe（tray/build.ps1），产出 dist/AtlispTray.exe
      - name: 构建托盘（签名渠道，或显式 TRAY_REBUILD=true）
        if: steps.pick.outputs.signer != 'none' || vars.TRAY_REBUILD == 'true'
        run: npm run build:tray


      # ---------- A. Azure Artifact Signing（原 Trusted Signing，2026-01 更名，功能不变）----------
      - name: Azure 登录（OIDC）
        if: steps.pick.outputs.signer == 'azure'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: 用 Azure Artifact Signing 签名
        if: steps.pick.outputs.signer == 'azure'
        uses: Azure/artifact-signing-action@v2
        with:
          # 认证：走 OIDC 联合身份（federated credential），不需要客户端密钥。
          # azure/login 已把 AZURE_ACCESS_TOKEN 注入环境，action 的
          # DefaultAzureCredential 会直接使用；无需 AZURE_CLIENT_SECRET。
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          endpoint: ${{ secrets.AZURE_TS_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_TS_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_TS_CERT_PROFILE }}
          files-folder: ${{ github.workspace }}\dist
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      # ---------- B. SignPath Foundation ----------
      # SignPath 的流程是「上传未签名产物 → 云端签名 → 下载签名产物」，
      # 所以先把两个 exe 作为 artifact 传上去，签完再覆盖回 dist/。
      - name: 上传待签名产物
        id: upload
        if: steps.pick.outputs.signer == 'signpath'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-binaries
          path: |
            dist/AtlispTray.exe
          if-no-files-found: error

      # 制品配置（artifact-configuration.xml）在 SignPath 控制台里维护，
      # 仓库里 signpath/artifact-configuration.xml 是它的源文件，改动后要同步粘贴上传。
      - name: 提交 SignPath 签名请求
        id: signpath
        if: steps.pick.outputs.signer == 'signpath'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ secrets.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ secrets.SIGNPATH_ARTIFACT_CONFIG_SLUG }}
          github-artifact-id: ${{ steps.upload.outputs.artifact-id }}
          wait-for-completion: true
          # 每次发版都要人工批准，默认 600s 容易在等待审批时超时
          wait-for-completion-timeout-in-seconds: 1800
          output-artifact-directory: ${{ github.workspace }}\dist-signed

      - name: 覆盖为已签名产物
        if: steps.pick.outputs.signer == 'signpath'
        shell: pwsh
        run: |
          Copy-Item dist-signed\*.exe dist\ -Force
          Get-ChildItem dist\*.exe | ForEach-Object { $_.FullName }

      # ---------- 校验 ----------
      - name: 校验签名（signtool verify）
        if: steps.pick.outputs.signer != 'none'
        shell: pwsh
        run: |
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" `
            -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw "找不到 signtool.exe（Windows SDK 未安装）" }
          foreach ($exe in @('dist\AtlispTray.exe')) {
            & $signtool.FullName verify /pa /v $exe
            if ($LASTEXITCODE -ne 0) { throw "签名校验失败：$exe" }
          }

      - name: 上传托盘产物（已签名，或显式放行的未签名版本）
        if: steps.pick.outputs.signer != 'none' || steps.pick.outputs.unsigned_ok == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tray-binaries-v${{ steps.version.outputs.version }}
          path: |
            dist/AtlispTray.exe
          if-no-files-found: error

  # 把已签名的 exe 挂到 GitHub Release：`atlisp-tray` 首次运行从这里下载
  # （npm 包里不再包含 exe，避免 npm install 阶段被 Defender 扫描）。
  release-assets:
    needs: sign
    if: startsWith(github.ref, 'refs/tags/v') && (needs.sign.outputs.signer != 'none' || needs.sign.outputs.unsigned_ok == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: tray-binaries-v${{ needs.sign.outputs.version }}
          path: dist

      - name: 生成下载清单
        run: node scripts/build-tray-manifest.mjs --require-all

      # 国内主源。没配 key 或上传失败都不阻塞发版：GitHub Release 仍是兜底源
      - name: 上传到 atlisp.cn（s3.atlisp.cn 镜像）
        continue-on-error: true
        env:
          ATLISP_UPLOAD_KEY: ${{ secrets.ATLISP_UPLOAD_KEY }}
          ATLISP_ALLOW_UNSIGNED: ${{ vars.ALLOW_UNSIGNED_RELEASE }}
        run: |
          if [ -z "$ATLISP_UPLOAD_KEY" ]; then
            echo "未配置 ATLISP_UPLOAD_KEY，跳过；本次只有 GitHub 一个下载源"
            exit 0
          fi
          node scripts/upload-tray.mjs

      - name: 上传 Release 资产
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          gh release view "$tag" >/dev/null 2>&1 || \
            gh release create "$tag" --title "$tag" --notes "Windows 二进制（已签名）与 SHA256 清单"
          gh release upload "$tag" \
            dist/AtlispTray.exe \
            dist/tray-manifest.json \
            dist/SHASUMS256.txt \
            --clobber

  # 只有在 workflow_dispatch 勾了 publish 才发版。
  # 关键：必须用 --ignore-scripts 发布，否则 prepack/prepublishOnly 会重新编译，
  # 把刚签好的 exe 覆盖回未签名版本。JS 侧构建和版本校验在这里显式执行。
  publish:
    needs: sign
    if: github.event_name == 'workflow_dispatch' && inputs.publish == 'true' && (needs.sign.outputs.signer != 'none' || needs.sign.outputs.unsigned_ok == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      # 只构建 JS 侧（build:main / build:worker / build:rot / build-meta）
      - run: npm run build

      - uses: actions/download-artifact@v4
        with:
          name: tray-binaries-v${{ needs.sign.outputs.version }}
          path: dist

      # 清单必须基于已签名产物生成：用户下载到的是这份，SHA256 要对得上
      - name: 生成托盘下载清单
        run: node scripts/build-tray-manifest.mjs --require-all

      - name: 校验 dist 版本与 package.json 一致
        run: node scripts/check-build.mjs

      - name: 确认发布的是已签名产物
        run: |
          test -f dist/AtlispTray.exe || { echo "缺少 dist/AtlispTray.exe"; exit 1; }

      - name: npm publish（跳过重编译）
        run: npm publish --access public --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
