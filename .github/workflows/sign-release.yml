name: Sign release binaries

# 给托盘（AtlispTray.exe）和独立更新器（AtlispUpdater.exe）做 Authenticode 签名。
#
# 为什么单独一个 workflow：签名需要凭据 / 云端 HSM，不适合每次 PR 都跑；
# 而且签名后的二进制必须是**最终发布**的那一份，不能签完又让 npm 重新编译。
#
# 两个渠道二选一，凭据都没有时整个 job 直接跳过（成功退出，不报警）：
#
#   A. Azure Trusted Signing（付费，约 $9.99/月起，CI 友好）
#      需要的 secrets：
#        AZURE_CLIENT_ID / AZURE_TENANT_ID / AZURE_SUBSCRIPTION_ID  OIDC 联邦凭据
#        AZURE_TS_ENDPOINT            例 https://eus.codesigning.azure.net
#        AZURE_TS_ACCOUNT             签名账户名
#        AZURE_TS_CERT_PROFILE        证书配置档名
#
#   B. SignPath Foundation（开源项目免费，证书在 SignPath 云端）
#      需要先在 SignPath 建好 project / signing policy / artifact configuration，
#      然后在 GitHub 仓库里配置：
#        SIGNPATH_API_TOKEN
#        SIGNPATH_ORGANIZATION_ID
#        SIGNPATH_PROJECT_SLUG
#        SIGNPATH_SIGNING_POLICY_SLUG
#        SIGNPATH_ARTIFACT_CONFIG_SLUG
#
# 本地签名（不经过 CI）：tray/build.ps1 -SignThumbprint <指纹>，见 tray/README.md。

on:
  workflow_dispatch:
    inputs:
      publish:
        description: '签名通过后自动 npm publish（用 --ignore-scripts，避免覆盖已签名产物）'
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write   # Azure Trusted Signing 用 OIDC 登录

jobs:
  sign:
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      signer: ${{ steps.pick.outputs.signer }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: 读取版本号
        id: version
        shell: pwsh
        run: |
          $v = (Get-Content package.json -Raw | ConvertFrom-Json).version
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "package version: $v"

      - run: npm ci

      # 走 Windows 自带 csc.exe（tray/build.ps1），产出 dist/AtlispTray.exe + dist/AtlispUpdater.exe
      - name: 构建托盘与更新器
        run: npm run build:tray

      - name: 选择签名渠道
        id: pick
        shell: pwsh
        run: |
          if ($env:AZURE_TS_ENDPOINT -and $env:AZURE_CLIENT_ID) {
            "signer=azure" >> $env:GITHUB_OUTPUT
            Write-Host "签名渠道：Azure Trusted Signing"
          } elseif ($env:SIGNPATH_API_TOKEN) {
            "signer=signpath" >> $env:GITHUB_OUTPUT
            Write-Host "签名渠道：SignPath Foundation"
          } else {
            "signer=none" >> $env:GITHUB_OUTPUT
            Write-Host "::warning title=未配置签名凭据::AZURE_TS_* / SIGNPATH_* 都没有设置，跳过签名。产物保持未签名。"
          }
        env:
          AZURE_TS_ENDPOINT: ${{ secrets.AZURE_TS_ENDPOINT }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}

      # ---------- A. Azure Trusted Signing ----------
      - name: Azure 登录（OIDC）
        if: steps.pick.outputs.signer == 'azure'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: 用 Azure Trusted Signing 签名
        if: steps.pick.outputs.signer == 'azure'
        uses: Azure/trusted-signing-action@v0
        with:
          # 认证：优先用上面的 OIDC（azure/login 拿到的凭据）。
          # 该 action 的部分版本要求显式凭据，届时再加一个 AZURE_CLIENT_SECRET secret：
          #   azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          #   azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          #   azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_TS_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_TS_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_TS_CERT_PROFILE }}
          files-folder: ${{ github.workspace }}\dist
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.digicert.com
          timestamp-digest: SHA256

      # ---------- B. SignPath Foundation ----------
      # SignPath 的流程是「上传未签名产物 → 云端签名 → 下载签名产物」，
      # 所以先把两个 exe 作为 artifact 传上去，签完再覆盖回 dist/。
      - name: 上传待签名产物
        id: upload
        if: steps.pick.outputs.signer == 'signpath'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-binaries
          path: |
            dist/AtlispTray.exe
            dist/AtlispUpdater.exe
          if-no-files-found: error

      - name: 提交 SignPath 签名请求
        id: signpath
        if: steps.pick.outputs.signer == 'signpath'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ secrets.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ secrets.SIGNPATH_ARTIFACT_CONFIG_SLUG }}
          github-artifact-id: ${{ steps.upload.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: ${{ github.workspace }}\dist-signed

      - name: 覆盖为已签名产物
        if: steps.pick.outputs.signer == 'signpath'
        shell: pwsh
        run: |
          Copy-Item dist-signed\*.exe dist\ -Force
          Get-ChildItem dist\*.exe | ForEach-Object { $_.FullName }

      # ---------- 校验 ----------
      - name: 校验签名（signtool verify）
        if: steps.pick.outputs.signer != 'none'
        shell: pwsh
        run: |
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" `
            -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw "找不到 signtool.exe（Windows SDK 未安装）" }
          foreach ($exe in @('dist\AtlispTray.exe', 'dist\AtlispUpdater.exe')) {
            & $signtool.FullName verify /pa /v $exe
            if ($LASTEXITCODE -ne 0) { throw "签名校验失败：$exe" }
          }

      - name: 上传已签名产物
        uses: actions/upload-artifact@v4
        with:
          name: signed-binaries-v${{ steps.version.outputs.version }}
          path: |
            dist/AtlispTray.exe
            dist/AtlispUpdater.exe
          if-no-files-found: error

  # 只有在 workflow_dispatch 勾了 publish 才发版。
  # 关键：必须用 --ignore-scripts 发布，否则 prepack/prepublishOnly 会重新编译，
  # 把刚签好的 exe 覆盖回未签名版本。JS 侧构建和版本校验在这里显式执行。
  publish:
    needs: sign
    if: github.event_name == 'workflow_dispatch' && inputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      # 只构建 JS 侧（build:main / build:worker / build:rot / build-meta）
      - run: npm run build

      - uses: actions/download-artifact@v4
        with:
          name: signed-binaries-v${{ needs.sign.outputs.version }}
          path: dist

      - name: 校验 dist 版本与 package.json 一致
        run: node scripts/check-build.mjs

      - name: 确认发布的是已签名产物
        run: |
          test -f dist/AtlispTray.exe || { echo "缺少 dist/AtlispTray.exe"; exit 1; }
          test -f dist/AtlispUpdater.exe || { echo "缺少 dist/AtlispUpdater.exe"; exit 1; }

      - name: npm publish（跳过重编译）
        run: npm publish --access public --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
