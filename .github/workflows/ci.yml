name: CI

on:
  push:
    branches: [main, master]
    paths:
      - 'tools/mcp-server/**'
  pull_request:
    branches: [main, master]
    paths:
      - 'tools/mcp-server/**'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20]
    defaults:
      run:
        working-directory: tools/mcp-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: tools/mcp-server/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test

  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/mcp-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: tools/mcp-server/package-lock.json
      - run: npm ci
      - run: npx eslint src/ --ext .js
        continue-on-error: true
